name: test
on: [push, pull_request]
env:
  BUILDDIR: "builddir"
  INSTALLDIR: "installdir"
  RUNUSER: "user"
jobs:
  autotools:
    runs-on: ubuntu-latest
    env:
      BUILD_OPTS: --enable-doc
      DISTCHECK: true
    container:
      image: ghcr.io/p11-glue/p11-kit:master
    steps:
      # Checkout repo
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/basic-autotools

  autotools-no-asn1:
    runs-on: ubuntu-latest
    env:
      BUILD_OPTS: --enable-doc --without-libtasn1 --without-trust-paths
    container:
      image: ghcr.io/p11-glue/p11-kit:master
    steps:
      # Checkout repo
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: dnf remove -y libtasn1-devel
      - uses: ./.github/actions/basic-autotools

  meson-no-asn1:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/p11-glue/p11-kit:master
    steps:
      # Checkout repo
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: dnf remove -y libtasn1-devel
      - uses: ./.github/actions/basic-meson

  address-sanitizer:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/p11-glue/p11-kit:master
    env:
      MESON_BUILD_OPTS: -Db_sanitize=address
    steps:
      # Checkout repo
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/basic-meson

  undefined-sanitizer:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/p11-glue/p11-kit:master
    env:
      MESON_BUILD_OPTS: -Db_sanitize=undefined
    steps:
      # Checkout repo
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/basic-meson

  scan-build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/p11-glue/p11-kit:master
    env:
      SCAN_BUILD: scan-build --status-bugs
    steps:
      # Checkout repo
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/basic-meson

  mingw:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/p11-glue/p11-kit:master
    env:
      MESON_BUILD_OPTS: --cross-file build/cross_file_mingw64.txt
      MESON_TEST_OPTS: --num-processes 1
      WINEPATH: /usr/x86_64-w64-mingw32/sys-root/mingw/bin
    steps:
      # Checkout repo
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/basic-meson

  MSYS2-mingw64:
    runs-on: windows-latest
    env:
      MESON_BUILD_OPTS: --cross-file build/cross_file_msys2.txt
      MESON_TEST_OPTS: --num-processes 1
    steps:
      # Checkout repo
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-meson mingw-w64-x86_64-toolchain mingw-w64-x86_64-libffi mingw-w64-x86_64-libtasn1
      - name: Run build steps in MSYS2
        shell: msys2 {0}
        run: |
          ./build/setup-wrapper.sh
          ./build/run-wrapper.sh meson setup $GITHUB_WORKSPACE/$BUILDDIR -Dstrict=true -Dprefix=$GITHUB_WORKSPACE/$INSTALLDIR -Dlibdir=$GITHUB_WORKSPACE/$INSTALLDIR/lib -Dsysconfdir=$GITHUB_WORKSPACE/$INSTALLDIR/etc -Dtrust_paths=$GITHUB_WORKSPACE/$INSTALLDIR/etc/pki/ca-trust-source:$GITHUB_WORKSPACE/$INSTALLDIR/share/pki/ca-trust-source -Dsystemd=disabled -Dbash_completion=disabled -Dpost_install_test=true $MESON_BUILD_OPTS
          ./build/run-wrapper.sh ninja -C $GITHUB_WORKSPACE/$BUILDDIR
          P11_KIT_DEBUG=all ./build/run-wrapper.sh meson test -C $GITHUB_WORKSPACE/$BUILDDIR $MESON_TEST_OPTS
          mkdir -p $GITHUB_WORKSPACE/$INSTALLDIR/etc/pki/ca-trust-source
          mkdir -p $GITHUB_WORKSPACE/$INSTALLDIR/share/pki/ca-trust-source
          mkdir -p $GITHUB_WORKSPACE/$INSTALLDIR/libexec/p11-kit
          ln -sf /usr/bin/true $GITHUB_WORKSPACE/$INSTALLDIR/libexec/p11-kit/trust-extract-compat
          ninja -C $GITHUB_WORKSPACE/$BUILDDIR install

  cppcheck:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/p11-glue/p11-kit:master
    env:
      PROFILE: cppcheck
    steps:
      # Checkout repo
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: |
          find common p11-kit trust -name '*.c' -print | cppcheck -f --platform=unix64 --relative-paths --language=c --quiet -I common -I p11-kit -I trust --file-list=- --inline-suppr --template='{file}:{line},{severity},{id},{message}' --error-exitcode=1

  coverage:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/p11-glue/p11-kit:master
    env:
      MESON_BUILD_OPTS: -Db_coverage=true
    steps:
      # Checkout repo
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/basic-meson
      - name: Genereate coverage
        run: runuser -u user -- ninja coverage -C $GITHUB_WORKSPACE/$BUILDDIR
      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@v1.1.2
        with:
          path-to-lcov: ./builddir/meson-logs/coverage.info
          github-token: ${{ secrets.github_token }}

  macos:
    runs-on: macos-latest
    env:
      MESON_BUILD_OPTS: -Dclosures=0
    steps:
      # Checkout repo
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: |
          brew upgrade -f
          brew install --overwrite coreutils gettext libffi libtasn1 meson
      - name: Update path
        run: |
          echo /usr/local/opt/gettext/bin >>${GITHUB_PATH}
      - uses: ./.github/actions/basic-meson

  libffi:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/p11-glue/p11-kit:master
    env:
      MESON_BUILD_OPTS: -Db_sanitize=address -Db_sanitize=undefined -Dclosures=0
    steps:
      # Checkout repo
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/basic-meson
